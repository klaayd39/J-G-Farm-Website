<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="J&G Farm Tracker — Manage calamansi farm income, expenses, harvests, and profitability." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>J&amp;G Farm Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
        if (!isLocal || !('serviceWorker' in navigator)) return
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (registration) { registration.unregister() })
        })
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) { caches.delete(key) })
          })
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
